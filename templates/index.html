<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexara</title>
    <link rel="icon" href="/static/logo-removebg-preview.png?v=4" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-container">
        <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="/static/logo-removebg-preview.png?v=4" class="brand-logo-img" alt="Nexara Logo">
                <div class="brand-info">
                    <h3>Nexara</h3>
                    <p>مساحة المساعد الذكي</p>
                </div>
            </div>
            <button id="newChatBtn" class="new-chat-btn"><i class="fa-solid fa-plus"></i> محادثة جديدة</button>

            <div class="folders-section">
                <div class="folders-header">
                    <span class="section-title">المجلدات</span>
                    <div class="folders-actions">
                        <i class="fa-solid fa-folder-plus" onclick="openCreateFolderModal()"
                            title="إنشاء مجلد جديد"></i>
                    </div>
                </div>
                <div id="foldersList" class="folders-list"></div>
            </div>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث في المحادثات...">
            </div>
            <div class="recent-chats">
                <span class="section-title">المحادثات الأخيرة</span>
                <div id="conversationsList"></div>
            </div>
            <div class="sidebar-footer">
                <div class="footer-item" onclick="openLibrary()"><i class="fa-regular fa-folder-open"></i> مكتبة الأوامر
                </div>
                <div class="footer-item" onclick="openSettings()"><i class="fa-solid fa-gear"></i> الإعدادات</div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div
                    style="display: flex; align-items: center; gap: 12px; width: 100%; justify-content: space-between;">
                    <button id="topSidebarToggle" class="top-toggle-btn" title="إخفاء / إظهار القائمة"><i
                            class="fa-solid fa-bars"></i></button>
                    <div class="header-title" style="flex: 1; text-align: center;">
                        <h2>مساعد Nexara</h2>
                        <p>النسخة التفاعلية الكاملة</p>
                    </div>
                    <div style="width: 40px;"></div>
                </div>
            </header>
            <div class="chat-area" id="chatBox">
                <div class="landing-greeting" id="landingGreeting">
                    <h1>مرحبا، كيف يمكنني مساعدتك اليوم؟</h1>
                </div>
            </div>
            <footer class="main-footer">
                <div class="input-container">
                    <div class="input-row">
                        <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
                        <div class="right-actions">
                            <button id="sendBtn" class="send-btn"><i class="fa-solid fa-arrow-left"></i></button>
                        </div>
                    </div>
                    <span class="version-text">Nexara 0.1</span>
                    <div class="input-toolbar">
                        <div class="tools">
                            <span class="tool-tag" id="webTool"><i class="fa-solid fa-globe"></i> ويب</span>
                            <span class="tool-tag" id="codeTool"><i class="fa-solid fa-code"></i> كود</span>
                            <!-- 🔥 زر الصوت المحدث -->
                            <span class="tool-tag" id="voiceTool">
                                <div class="mic-container">
                                    <i class="fa-solid fa-microphone"></i>
                                    <div class="wave"></div>
                                    <div class="wave"></div>
                                    <div class="wave"></div>
                                    <div class="wave"></div>
                                    <div class="wave"></div>
                                </div>
                                صوت
                            </span>
                        </div>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <!-- المودال الرئيسي -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box" id="modalBox">
            <div class="modal-title" id="modalTitle">تأكيد الحذف</div>
            <div id="modalContentContainer">
                <input type="text" id="modalInput" class="modal-input" placeholder="أدخل الاسم الجديد..."
                    style="display: none;">
                <p id="modalMessage" style="color: var(--text-gray); margin-bottom: 0;"></p>
            </div>
            <div class="modal-buttons">
                <button id="modalCancelBtn" class="modal-btn cancel">إلغاء</button>
                <button id="modalConfirmBtn" class="modal-btn confirm">تأكيد</button>
            </div>
        </div>
    </div>

    <!-- مودال نقل المحادثة -->
    <div id="moveModalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-title">نقل المحادثة إلى مجلد</div>
            <select id="moveFolderSelect" class="modal-input"
                style="display: block; width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc;">
                <option value="0">غير مصنف</option>
            </select>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeMoveModal()">إلغاء</button>
                <button class="modal-btn confirm" onclick="executeMove()">نقل</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
